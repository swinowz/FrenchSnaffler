[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepGitHubToken"
MatchAction = "Snaffle"
Description = "GitHub personal access, OAuth, app, or fine-grained token"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["\\b(gh[pousr]_[A-Za-z0-9_]{20,})\\b", "\\bgithub_pat_[A-Za-z0-9_]{20,}\\b"]
Triage = "Red"

[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepGoogleApiKey"
MatchAction = "Snaffle"
Description = "Google API key"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["\\bAIza[0-9A-Za-z_-]{35}\\b"]
Triage = "Red"

[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepAzureClientSecret"
MatchAction = "Snaffle"
Description = "Azure client secret or application secret"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["(?i)(client[_ -]?secret|azure[_ -]?secret|app[_ -]?secret)[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9._~+/=-]{20,}"]
Triage = "Red"

[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepJwtToken"
MatchAction = "Snaffle"
Description = "JSON Web Token containing three encoded segments"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\b"]
Triage = "Red"

[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepKubernetesConfig"
MatchAction = "Snaffle"
Description = "Kubernetes configuration containing a client certificate or token"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["(?i)(client-certificate-data|client-key-data|token):\\s*[A-Za-z0-9+/=_-]{20,}"]
Triage = "Red"

[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepDockerRegistryCredential"
MatchAction = "Snaffle"
Description = "Docker registry authentication material"
MatchLocation = "FileContentAsString"
WordListType = "Regex"
WordList = ["(?i)(auth|password|identitytoken|registrytoken)[\"']?\\s*[:=]\\s*[\"']?[A-Za-z0-9+/=_-]{16,}"]
Triage = "Yellow"
