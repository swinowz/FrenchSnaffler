[[ClassifierRules]]
EnumerationScope = "ContentsEnumeration"
RuleName = "KeepPassOrKeyInCode"
MatchAction = "Snaffle"
Description = "Files with contents matching these regexen are very interesting."
MatchLocation = "FileContentAsString"
WordListType = "Regex"
MatchLength = 0
WordList = ["passw?o?r?d\\s*=\\s*[\\'\\\"][^\\'\\\"]....",
"api[Kk]ey\\s*=\\s*[\\'\\\"][^\\'\\\"]....",
"passw?o?r?d?>\\s*[^\\s<]+\\s*<",
"passw?o?r?d?>.{3,2000}</pass",
"[\\s]+-passw?o?r?d?",
"api[kK]ey>\\s*[^\\s<]+\\s*<",
"[_\\-\\.]oauth\\s*=\\s*[\\'\\\"][^\\'\\\"]....",
"client_secret\\s*=*\\s*",
"<ExtendedMatchKey>ClientAuth",
"GIUserPassword",
"(?i)<[^>]*(ftp|smtp|excel|mail|db|sql|ldap|ssh|sftp)[._-]?(password|pwd)[^>]*>\\s*[^<]{2,}\\s*</",
"(?i)password\\s+[a-f0-9]{32,}\\s+(encrypted|privilege)",
"(?i)username\\s+[\\'\\\"][^\\'\\\"]...\\s+password\\s+[a-f0-9]{32,}",
"(?i)(user\\s+id|userid)\\s*=\\s*[^;]+;\\s*password\\s*=\\s*[\\'\\\"]?[^\\'\\\";&]{3,}[\\'\\\"]?",
"(?i)password\\s*=\\s*[\\'\\\"][^\\'\\\"]{3,}[\\'\\\"]\\s*;"
]
Triage = "Red"
