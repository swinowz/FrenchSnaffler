# Relay rule to route Office documents to content scanning
# This enables UltraSnaffler to parse and search inside .xlsx, .docx, etc.
# NOTE: PDFs, PPT, RTF, EML removed - slow to parse, rarely have extractable credentials

[[ClassifierRules]]
EnumerationScope = "FileEnumeration"
RuleName = "RelayOfficeDocsForCredentials"
MatchAction = "Relay"
RelayTargets = ["KeepFrenchCredentialTableHeaders",
"KeepPassOrKeyInCode",
"KeepAwsKeysInCode",
"KeepInlinePrivateKey",
"KeepSlackTokensInCode",
"KeepDbConnStringPw"]
Description = "Office documents will be parsed and searched for credentials."
MatchLocation = "FileExtension"
WordListType = "Regex"
MatchLength = 0
WordList = ["\\.xlsx",
"\\.xls",
"\\.docx",
"\\.doc",
"\\.docm",
"\\.xlsm",
"\\.dot",
"\\.dotx",
"\\.dotm",
"\\.xlt",
"\\.xltx",
"\\.xltm"]
Triage = "Green"
